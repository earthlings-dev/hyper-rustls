[package]
name = "hyper-rustls"
version = "0.27.7"
edition = "2024"
rust-version = "1.93"
license = "Apache-2.0 OR ISC OR MIT"
readme = "README.md"
description = "Rustls+hyper integration for pure rust HTTPS"
homepage = "https://github.com/rustls/hyper-rustls"
repository = "https://github.com/rustls/hyper-rustls"
documentation = "https://docs.rs/hyper-rustls/"
include = ["Cargo.toml", "LICENSE-MIT", "LICENSE-APACHE", "LICENSE-ICS", "README.md", "src/**/*.rs"]

[features]
default = ["native-tokio", "http1", "logging", "aws-lc-rs"]
aws-lc-rs = ["dep:rustls-aws-lc-rs"]
fips = ["aws-lc-rs", "rustls-aws-lc-rs?/fips"]
http1 = ["hyper-util/http1"]
http2 = ["hyper-util/http2"]
logging = ["log", "tokio-rustls/logging", "rustls/log"]
native-tokio = ["rustls-native-certs"]
ring = ["dep:rustls-ring"]
webpki-tokio = ["webpki-roots"]

[dependencies]
http = "1"
hyper = { version = "1", default-features = false }
hyper-util = { version = "0.1", default-features = false, features = ["client-legacy", "tokio"] }
log = { version = "0.4.29", optional = true }
rustls = { version = "0.24.0-dev.0", default-features = false }
rustls-aws-lc-rs = { version = "0.1.0-dev.0", optional = true }
rustls-native-certs = { version = "0.8", optional = true }
rustls-platform-verifier = { version = "0.6", optional = true }
rustls-ring = { version = "0.1.0-dev.0", optional = true }
tokio = "1.49"
tokio-rustls = { version = "0.26.4", default-features = false }
tower-service = "0.3"
webpki-roots = { version = "1", optional = true }

[dev-dependencies]
cfg-if = "1"
http-body-util = "0.1"
hyper-util = { version = "0.1", default-features = false, features = ["server-auto"] }
rustls = { version = "0.24.0-dev.0", default-features = false }
rustls-aws-lc-rs = { version = "0.1.0-dev.0" }
tokio = { version = "1.49", features = ["io-std", "macros", "net", "rt-multi-thread"] }

[[example]]
name = "client"
path = "examples/client.rs"
required-features = ["native-tokio", "http1"]

[[example]]
name = "server"
path = "examples/server.rs"
required-features = ["aws-lc-rs"]

[package.metadata.docs.rs]
no-default-features = true
features = [
    "http1",
    "http2",
    "logging",
    "native-tokio",
    "ring",
    "rustls-platform-verifier",
    "webpki-tokio",
]
rustdoc-args = ["--cfg", "docsrs"]

[patch.crates-io]
aws-lc-rs = { path = "../aws-lc-rs/aws-lc-rs" }
rustls = { path = "../rustls/rustls" }
rustls-aws-lc-rs = { path = "../rustls/rustls-aws-lc-rs" }
rustls-pki-types = { path = "../pki-types" }
rustls-ring = { path = "../rustls/rustls-ring" }
rustls-webpki = { path = "../rustls-webpki" }
tokio = { path = "../tokio/tokio" }
tokio-rustls = { path = "../tokio-rustls" }
rustls-platform-verifier = { path = "../rustls-platform-verifier/rustls-platform-verifier" }
webpki-roots = { path = "../webpki-roots/webpki-roots" }
